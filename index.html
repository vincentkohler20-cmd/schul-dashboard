<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schule – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">

<!-- Home-Bildschirm-Icon; die Seite muss aber auch im normalen Safari-Tab
     (iPad in der Schule, Appsperre) sauber aussehen - nichts haengt vom
     Standalone-Modus ab. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
</head>
<body>

<nav class="tabs" id="tabs" aria-label="Bereiche" hidden>
  <button class="tab-btn active" data-tab="heute" data-titel="Heute" aria-current="page">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    <span class="tab-label">Heute</span>
  </button>
  <button class="tab-btn" data-tab="aufgaben" data-titel="Aufgaben">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8.5 12 2.5 2.5 5-5.5"/></svg>
    <span class="tab-label">Aufgaben</span>
  </button>
  <button class="tab-btn" data-tab="klausuren" data-titel="Klausuren">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span class="tab-label">Klausuren</span>
  </button>
  <button class="tab-btn" data-tab="punkte" data-titel="Punkte">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16.5v-6M12 16.5V5.5M17 16.5v-3.5"/></svg>
    <span class="tab-label">Punkte</span>
  </button>
  <button class="tab-btn" data-tab="begleiter" data-titel="Begleiter">
    <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5h10.5a2.5 2.5 0 0 1 2.5 2.5v13H8a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M5.5 17.5A2.5 2.5 0 0 1 8 15h10.5"/></svg>
    <span class="tab-label">Begleiter</span>
  </button>
</nav>

<div class="seite">
  <header class="kopf">
    <div class="kopf-oben">
      <div class="kopf-datum" id="kopf-datum">Schul-Dashboard</div>
      <div class="header-aktionen" id="header-aktionen" hidden>
        <button id="aktualisieren-btn" class="icon-btn" title="Aktualisieren" aria-label="Aktualisieren">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.5H15"/></svg>
        </button>
        <button id="abmelden-btn" class="icon-btn" title="Abmelden" aria-label="Abmelden">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v8M6.7 6.7a7.5 7.5 0 1 0 10.6 0"/></svg>
        </button>
      </div>
    </div>
    <div class="kopf-zeile">
      <h1 id="seitentitel">Schul-Dashboard</h1>
      <div class="offen-chip" id="offen-chip" title="Heute noch empfohlene Lernminuten" hidden></div>
    </div>
    <p class="untertitel" id="status-zeile">Verbunden mit deinem Google Drive</p>
  </header>

  <main id="app">
    <section id="anmelde-bereich" class="anmelde-bereich">
      <p>Melde dich mit deinem Google-Konto an, um deinen Vault zu öffnen.</p>
      <button id="anmelden-btn" class="btn btn-primaer">Mit Google anmelden</button>
      <p id="anmelde-fehler" class="fehler-text" hidden></p>
    </section>

    <section id="inhalt-bereich" class="inhalt-bereich" hidden>
      <div id="vault-hinweis" class="hinweis-banner" role="status" hidden></div>
      <div id="schreibrechte-hinweis" class="hinweis-banner hinweis-mit-aktion" role="status" hidden>
        <span>Bitte einmal neu anmelden, um Schreibrechte zu erteilen – bis dahin kann nur gelesen werden.</span>
        <button id="schreibrechte-btn" type="button" class="btn btn-sekundaer btn-klein">Neu anmelden</button>
      </div>
      <section id="tab-heute" class="tab-inhalt"></section>
      <section id="tab-aufgaben" class="tab-inhalt" hidden></section>
      <section id="tab-klausuren" class="tab-inhalt" hidden></section>
      <section id="tab-punkte" class="tab-inhalt" hidden></section>
      <section id="tab-begleiter" class="tab-inhalt" hidden></section>

      <section id="klausur-detail-overlay" class="detail-overlay" hidden></section>
    </section>
  </main>
</div>

<!-- Bestaetigungsdialog vor jedem Speichern (siehe bestaetige() in app.js) -->
<dialog id="bestaetigen-dialog" class="dialog" aria-labelledby="bestaetigen-titel" aria-describedby="bestaetigen-text">
  <div class="dialog-inhalt">
    <h2 id="bestaetigen-titel">Speichern?</h2>
    <p id="bestaetigen-text"></p>
    <p id="bestaetigen-hinweis" class="hinweis-text" hidden></p>
    <div class="dialog-aktionen">
      <button type="button" id="bestaetigen-abbrechen" class="btn btn-sekundaer">Abbrechen</button>
      <button type="button" id="bestaetigen-ok" class="btn btn-primaer">Speichern</button>
    </div>
  </div>
</dialog>

<!-- Erfolg (verschwindet nach ~2 s) bzw. Fehler (bleibt, bis weggetippt) -->
<div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
